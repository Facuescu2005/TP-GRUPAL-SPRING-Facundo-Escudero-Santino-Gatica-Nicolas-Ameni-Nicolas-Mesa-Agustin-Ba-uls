spring.application.name=facturacion
server.port=8080

# ---------- MySQL (configuración por defecto) ----------
# Ajustar usuario y clave a tu instalación local.
spring.datasource.url=jdbc:mysql://localhost:3306/facturacion?createDatabaseIfNotExist=true&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- JSON ----------
# Fechas como "2026-03-15" (igual que la respuesta esperada del TP)
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=America/Argentina/Buenos_Aires

# Carpeta donde se guardan los reportes PDF / Excel generados al iniciar
app.reportes.carpeta=reportes
